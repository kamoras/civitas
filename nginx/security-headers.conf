# The site's security headers, in one place, included by civitas.conf at
# server level AND in every location that sets a header of its own.
#
# nginx inherits add_header from the enclosing level only when a location
# sets none itself: a single `add_header X-Cache-Status ...` in a location
# silently dropped all four of these on its responses (found 2026-09 on
# about 18 locations, /api/og's images included). So any location that adds
# a header must include this file too; tests/test_nginx_config.py fails when
# one doesn't.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
