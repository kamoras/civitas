proxy_cache_path /var/cache/nginx/civitas levels=1:2
    keys_zone=civitas_cache:10m max_size=256m inactive=30m
    use_temp_path=off;

# Part of every cache key. check-and-deploy.sh writes a new one after a
# rollout and reloads nginx: what was cached before — perhaps from the old
# release's backend while the rollout overlapped the two — is then never
# matched again, and ages out through nginx's own cache manager (a purge
# that deletes cache files instead leaves nginx's index pointing at them).
map $host $cache_epoch {
    default "0";
    include /etc/nginx/cache-epoch/*.conf;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
# /photo/ (member portraits for share images): see its location.
limit_req_zone $binary_remote_addr zone=photo_limit:5m rate=5r/s;
# The catch-all /api/'s limit, counted where only its cache misses arrive
# (the "api-misses" server below), keyed by the client address the outer
# server resolved and passed on.
limit_req_zone $http_x_real_ip zone=api_miss_limit:10m rate=30r/s;
limit_req_zone $http_x_real_ip zone=search_miss_limit:5m rate=5r/s;
# OG images: a zone of their own, so a link-preview crawler isn't refused
# for the API misses of the same address (or the reverse). A miss renders a
# PNG (and may fetch a member photo), and any query string is a new cache
# key, so misses are held to 2 r/s; hits are never limited.
limit_req_zone $http_x_real_ip zone=og_miss_limit:5m rate=2r/s;

# The public server's connections to the api-misses server, kept open: its
# address is fixed (unlike backend/frontend, which are re-resolved on every
# request and so give up keepalive), so there is no reason to connect anew
# for each miss.
upstream api_misses {
    server 127.0.0.1:8090;
    keepalive 16;
}

# Cache misses of the catch-all /api/ location, on their way to the backend.
# The limit lives here, not on /api/ itself: limit_req runs before the cache
# lookup, so there it refused cache hits too — responses nginx already holds
# — to many readers behind one address (a school, a library, a carrier NAT)
# opening the same pages. Here it counts exactly the requests that make the
# backend work, cache-busting query strings included, with no list of
# routes to keep up to date. Loopback only: nothing outside can reach it or
# choose the X-Real-IP it is keyed by.
server {
    listen 127.0.0.1:8090;
    server_name api-misses;
    # The public server logs each request, with the real client; a second
    # line here would name loopback as the client.
    access_log off;
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream backend:8000;
    set $frontend_upstream frontend:3000;

    # Link-preview images, rendered by the frontend (satori, plus a fetch
    # of the member's photo): a miss is the costliest request on the site.
    location = /api/og {
        limit_req zone=og_miss_limit burst=20 nodelay;
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Explore search's misses: its own, tighter limit.
    location = /api/explore {
        limit_req zone=search_miss_limit burst=10 nodelay;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        limit_req zone=api_miss_limit burst=60 nodelay;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        # Passed on as the outer server set them: appending this hop would
        # make loopback the last X-Forwarded-For entry, which is the one
        # the backend identifies clients by (rate_limit.client_ip).
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}

server {
    listen 8081;
    proxy_cache_key "$scheme$proxy_host$request_uri|$cache_epoch";
    listen [::]:8081;
    server_name _;

    # civitas-research.org is Cloudflare-proxied (orange-cloud), but this
    # container is NOT the hop that receives Cloudflare's connection — a
    # separate host-level nginx (systemd, outside this repo, shared with
    # two other unrelated projects on the same Pi) terminates Cloudflare's
    # edge connection on port 80 first, then proxies here to :8081. This
    # was originally written trusting Cloudflare's own IP ranges directly
    # (wrong hop — live-confirmed 2026-07-23 it never fired, since this
    # container's actual peer is always the host nginx's own address, not
    # a Cloudflare edge IP). The host nginx now has the matching
    # Cloudflare-range trust + real_ip_header CF-Connecting-IP itself
    # (see its own config, not in this repo) and correctly sets X-Real-IP
    # to the true visitor IP before forwarding here — so this hop only
    # needs to trust ITS OWN peer (that host nginx process) and read the
    # header it sets. Without this, $remote_addr here is that host
    # nginx's own connecting address, which fed backend/app/api/visits.py
    # and collapsed what should have been ~150 distinct daily visitors
    # down to single digits.
    set_real_ip_from 192.168.0.101;
    real_ip_header X-Real-IP;

    # stdout/stderr, not a file under /var/log — a file path here is
    # invisible to `docker service logs`/`docker logs` (live-verified: no
    # request lines ever showed up there, only nginx's own startup
    # notices, which nginx writes to stdout separately by default). Docker
    # containers should log to their standard streams, not files no one
    # is reading.
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # A static `upstream {}` block (the first version of this file used
    # one) resolves backend/frontend's DNS name exactly once, when nginx
    # starts — which both crashes nginx hard ("host not found in
    # upstream") if the target task's DNS registration hasn't propagated
    # yet at that exact moment (live-tested: a real crash-loop on a fresh
    # stack deploy), and worse, defeats the entire point of moving nginx
    # into the stack: after a later rolling update replaces a task, a
    # static upstream keeps sending traffic to that now-dead task's
    # cached IP forever, since nothing ever tells nginx to re-resolve.
    # Docker's embedded DNS resolver + a variable in proxy_pass forces
    # nginx to re-resolve on every request instead (standard pattern for
    # nginx in front of dynamic container DNS) — the trade-off is losing
    # upstream-level connection keepalive to backend/frontend (keepalive
    # pooling requires a real `upstream {}` block), acceptable for this
    # traffic volume.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream backend:8000;
    set $frontend_upstream frontend:3000;
    # The backend's pipeline half (docker-compose.swarm.yml's `pipeline`,
    # PROCESS_ROLE=worker): see "Background work" below.
    set $pipeline_upstream pipeline:8000;

    # Security headers. Re-included in every location that adds a header of
    # its own, which would otherwise drop them (see the snippet's comment).
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml
        image/svg+xml;

    # -- Cached read-only API endpoints --
    #
    # Nearly every public read is cached by the catch-all `location /api/`
    # at the end, for as long as the backend's own Cache-Control says
    # (api/cache_headers.py: max-age plus stale-while-revalidate, with an
    # ETag hashed from the body, so a revalidation is answered 304 only
    # while the data is unchanged). /api/config is the one read outside the
    # backend's cacheable prefixes, so it keeps a lifetime set here.

    location = /api/config {
        # Misses limited in the "api-misses" server, as for /api/.
        proxy_pass http://api_misses;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache civitas_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # -- Admin: local network only (returns 404 to public) --
    #
    # `^~` on both: nginx tries regex locations before an ordinary prefix
    # match, so without it any regex below that happens to match an admin
    # path (the pipeline-trigger one matches /api/admin/pipeline/trigger)
    # would take the request and skip this allow list.

    location ^~ /api/admin/ {
        allow 127.0.0.1;
        allow ::1;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        error_page 403 =404 /404.html;

        # The pipeline process: every admin action that starts a run or
        # holds the database runs there, and the run flags the status
        # endpoints report live in its memory.
        proxy_pass http://$pipeline_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location ^~ /admin {
        allow 127.0.0.1;
        allow ::1;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        error_page 403 =404 /404.html;

        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # -- Background work: the pipeline process --
    #
    # Every endpoint that starts a background run goes to the pipeline
    # process, never the read-only API one (backend PROCESS_ROLE=api
    # refuses them with a 503, so a trigger missing from here fails loudly
    # rather than running a pipeline beside page requests). Token-protected
    # in the backend, and as reachable as before. Admin endpoints are
    # routed there above. tests/test_nginx_routing.py fails when a new
    # mutating route (POST, PUT, PATCH, DELETE) is neither matched here nor
    # listed as served by the API.

    location ~ ^/api/(?:[a-z]+/)?pipeline/trigger$ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://$pipeline_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Explore summaries: an LLM generation that outlives its request and is
    # shared by every reader of the text (services/explore_summary.py), so
    # it runs in the pipeline process. A stream, read as it is written:
    # unbuffered, with the generation's keepalives inside the read timeout.
    # The pipeline down or restarting (a deploy) answers as a wait the page
    # asks again after, not as a failure it shows.
    location ~ ^/api/explore/[0-9]+/summary$ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://$pipeline_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
        error_page 502 504 = @summary_wait;
    }
    location @summary_wait {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Summary-Wait 1 always;
        add_header Retry-After 30 always;
        default_type application/json;
        return 503 '{"detail": "Summaries are unavailable right now; please try again shortly."}';
    }
    location = /api/action/refresh {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://$pipeline_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # The Action Center's country news takes no parameters: keyed on the
    # path alone, so a query string can't turn every request into a miss
    # (each a live fetch of every news feed). Otherwise as the catch-all.
    location = /api/action/country-news {
        proxy_pass http://api_misses;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache civitas_cache;
        proxy_cache_key "$scheme$proxy_host$uri|$cache_epoch";
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # -- Explore search (rate-limited, CPU-intensive) --

    location = /api/explore {
        # Misses through the api-misses server's search limit; hits served
        # here, never refused (see the catch-all /api/ below).
        proxy_pass http://api_misses;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Lifetime from the backend's Cache-Control, as for the catch-all.
        proxy_cache civitas_cache;
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # -- OG image route (a Next.js Route Handler, not backend API) --
    #
    # /api/og lives under the frontend app (frontend/src/app/api/og/
    # route.tsx), not the FastAPI backend — but it sits under the /api/
    # prefix everything else here routes to $backend_upstream, and the
    # generic `location /api/` catch-all below matched it first (longest-
    # prefix wins in nginx only among prefix locations that actually
    # match; a more specific /api/og prefix here beats the shorter /api/
    # one regardless of file order). Confirmed live 2026-09-02: every OG
    # image request — politician and issue alike — was silently proxied
    # to the backend instead, which correctly 404'd (it has no such
    # route), so no Open Graph image has ever actually rendered in
    # production; a reader only ever saw the platform's generic fallback
    # card, or nothing, never the per-issue/per-politician one built for
    # it. Cached like the other read-mostly API responses so a burst of
    # link-preview crawlers for the same URL doesn't re-render the image
    # (fetch the external photo, base64-encode it, run satori) per hit.
    #
    # Exact match, not a prefix: route.tsx has no catch-all/sub-path
    # segment, so /api/og is the only real path — a prefix match would
    # also (harmlessly today, but needlessly) route something like
    # /api/oganize-whatever to the frontend.

    location = /api/og {
        # Misses limited in the "api-misses" server, as for /api/.
        proxy_pass http://api_misses;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache civitas_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # -- Member photos for share images (a Next.js Route Handler) --
    #
    # frontend/src/app/photo/bioguide/[id]/route.ts fetches a member's
    # portrait from bioguide.congress.gov so the browser can draw it into a
    # shared image. Every miss there is an outbound request from this server
    # that can hold a Node request for up to 5s, and the id space is large
    # enough to walk, so hits AND misses are cached here and the path is
    # rate-limited per client: a loop over made-up ids must not turn this
    # server into a bioguide hammer (and get its IP challenged, which would
    # break the OG cards' photos too). A capture fetches one photo, so the
    # limit is generous for real use; it is also the backstop the cache
    # can't be, since a real member's photo is still one miss per 30m.

    location /photo/ {
        limit_req zone=photo_limit burst=20 nodelay;
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache civitas_cache;
        # Keyed on the path alone, and blind to Vary: the route ignores the
        # query string and every request header, so neither may mint a new
        # cache entry (and a fresh bioguide fetch) on demand. Next's Vary
        # (rsc, next-router-state-tree, ...) would otherwise split the cache
        # on headers a client chooses.
        proxy_cache_key $scheme$proxy_host$uri;
        proxy_ignore_headers Vary;
        # A photo stays up to a day, but the shared zone's inactive=30m
        # evicts one nobody has asked for in half an hour — fine, it is
        # refetched once. The route answers a real "no such photo" with a
        # 404 (cached here) and a transient failure with an uncached 502,
        # for which the stale copy below is served instead.
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        # No add_header here, so the server-level security headers apply
        # as-is; nosniff matters for a route that passes an upstream image's
        # Content-Type through. A location that adds one must include
        # security-headers.conf (see that file).
    }

    # -- Public developer API (rate-limited, not cached here) --
    #
    # Its responses carry the caller's own X-RateLimit-Remaining/-Reset;
    # a cached copy would hand one client's counts to every other.

    location /api/public/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # -- Every other API endpoint (rate-limited, cached as the backend says) --
    #
    # No proxy_cache_valid on purpose: nginx then stores exactly the
    # responses the backend marks cacheable (a 200 from a public read,
    # api/cache_headers.py) for exactly as long as it says, and nothing
    # else — admin, health, visit tracking and every error carry no
    # Cache-Control and pass straight through. POSTs are never cached.
    # A new public endpoint is cached here the moment it opts in with a
    # header; it needs no block of its own.
    #
    # Expired entries are refreshed behind the reader
    # (background_update) with a conditional request the backend answers
    # with a bodiless 304 when the data hasn't changed (revalidate), and
    # served stale while the backend is down or restarting.

    location /api/ {
        # Misses go through the "api-misses" server, which rate-limits them
        # (see its comment); hits are served here, never refused.
        proxy_pass http://api_misses;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 16k;
        proxy_cache civitas_cache;
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # -- Next.js static assets (immutable hashed filenames) --

    location /_next/static/ {
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache civitas_cache;
        proxy_cache_valid 200 30d;
        # No Cache-Control of our own: Next already sends "public,
        # max-age=31536000, immutable" for these (and no-store on a 404 for
        # a missing chunk, which must reach the browser as-is). Adding ours
        # sent the header twice.
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # -- Frontend (HTML pages, SSR) --

    location / {
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
