proxy_cache_path /var/cache/nginx/civitas levels=1:2
    keys_zone=civitas_cache:10m max_size=256m inactive=30m
    use_temp_path=off;

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=search_limit:5m rate=5r/s;

server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    # civitas-research.org is Cloudflare-proxied (orange-cloud), but this
    # container is NOT the hop that receives Cloudflare's connection — a
    # separate host-level nginx (systemd, outside this repo, shared with
    # two other unrelated projects on the same Pi) terminates Cloudflare's
    # edge connection on port 80 first, then proxies here to :8081. This
    # was originally written trusting Cloudflare's own IP ranges directly
    # (wrong hop — live-confirmed 2026-07-23 it never fired, since this
    # container's actual peer is always the host nginx's own address, not
    # a Cloudflare edge IP). The host nginx now has the matching
    # Cloudflare-range trust + real_ip_header CF-Connecting-IP itself
    # (see its own config, not in this repo) and correctly sets X-Real-IP
    # to the true visitor IP before forwarding here — so this hop only
    # needs to trust ITS OWN peer (that host nginx process) and read the
    # header it sets. Without this, $remote_addr here is that host
    # nginx's own connecting address, which fed backend/app/api/visits.py
    # and collapsed what should have been ~150 distinct daily visitors
    # down to single digits.
    set_real_ip_from 192.168.0.101;
    real_ip_header X-Real-IP;

    # stdout/stderr, not a file under /var/log — a file path here is
    # invisible to `docker service logs`/`docker logs` (live-verified: no
    # request lines ever showed up there, only nginx's own startup
    # notices, which nginx writes to stdout separately by default). Docker
    # containers should log to their standard streams, not files no one
    # is reading.
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # A static `upstream {}` block (the first version of this file used
    # one) resolves backend/frontend's DNS name exactly once, when nginx
    # starts — which both crashes nginx hard ("host not found in
    # upstream") if the target task's DNS registration hasn't propagated
    # yet at that exact moment (live-tested: a real crash-loop on a fresh
    # stack deploy), and worse, defeats the entire point of moving nginx
    # into the stack: after a later rolling update replaces a task, a
    # static upstream keeps sending traffic to that now-dead task's
    # cached IP forever, since nothing ever tells nginx to re-resolve.
    # Docker's embedded DNS resolver + a variable in proxy_pass forces
    # nginx to re-resolve on every request instead (standard pattern for
    # nginx in front of dynamic container DNS) — the trade-off is losing
    # upstream-level connection keepalive to backend/frontend (keepalive
    # pooling requires a real `upstream {}` block), acceptable for this
    # traffic volume.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream backend:8000;
    set $frontend_upstream frontend:3000;
    # The backend's pipeline half (docker-compose.swarm.yml's `pipeline`,
    # PROCESS_ROLE=worker): see "Background work" below.
    set $pipeline_upstream pipeline:8000;

    # Security headers. `add_header_inherit merge`: without it, any
    # location with an add_header of its own (every cached one sets
    # X-Cache-Status) silently drops all four of these — nginx inherits
    # add_header only into locations that define none, so cached API
    # responses and /_next/static/ went out without nosniff or
    # X-Frame-Options.
    add_header_inherit merge;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml
        image/svg+xml;

    # -- Cached read-only API endpoints --
    #
    # Nearly every public read is cached by the catch-all `location /api/`
    # at the end, for as long as the backend's own Cache-Control says
    # (api/cache_headers.py: max-age plus stale-while-revalidate, with an
    # ETag hashed from the body, so a revalidation is answered 304 only
    # while the data is unchanged). /api/config is the one read outside the
    # backend's cacheable prefixes, so it keeps a lifetime set here.

    location = /api/config {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache civitas_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # -- Admin: local network only (returns 404 to public) --
    #
    # `^~` on both: nginx tries regex locations before an ordinary prefix
    # match, so without it any regex below that happens to match an admin
    # path (the pipeline-trigger one matches /api/admin/pipeline/trigger)
    # would take the request and skip this allow list.

    location ^~ /api/admin/ {
        allow 127.0.0.1;
        allow ::1;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        error_page 403 =404 /404.html;

        # The pipeline process: every admin action that starts a run or
        # holds the database runs there, and the run flags the status
        # endpoints report live in its memory.
        proxy_pass http://$pipeline_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location ^~ /admin {
        allow 127.0.0.1;
        allow ::1;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        error_page 403 =404 /404.html;

        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # -- Background work: the pipeline process --
    #
    # Every endpoint that starts a background run goes to the pipeline
    # process, never the read-only API one (backend PROCESS_ROLE=api
    # refuses them with a 503, so a trigger missing from here fails loudly
    # rather than running a pipeline beside page requests). Token-protected
    # in the backend, and as reachable as before. Admin endpoints are
    # routed there above. tests/test_nginx_routing.py fails when a new
    # POST route is neither matched here nor listed as served by the API.

    location ~ ^/api/(?:[a-z]+/)?pipeline/trigger$ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://$pipeline_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /api/action/refresh {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://$pipeline_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # -- Explore search (rate-limited, CPU-intensive) --

    location = /api/explore {
        limit_req zone=search_limit burst=10 nodelay;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Lifetime from the backend's Cache-Control, as for the catch-all.
        proxy_cache civitas_cache;
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # -- OG image route (a Next.js Route Handler, not backend API) --
    #
    # /api/og lives under the frontend app (frontend/src/app/api/og/
    # route.tsx), not the FastAPI backend — but it sits under the /api/
    # prefix everything else here routes to $backend_upstream, and the
    # generic `location /api/` catch-all below matched it first (longest-
    # prefix wins in nginx only among prefix locations that actually
    # match; a more specific /api/og prefix here beats the shorter /api/
    # one regardless of file order). Confirmed live 2026-09-02: every OG
    # image request — politician and issue alike — was silently proxied
    # to the backend instead, which correctly 404'd (it has no such
    # route), so no Open Graph image has ever actually rendered in
    # production; a reader only ever saw the platform's generic fallback
    # card, or nothing, never the per-issue/per-politician one built for
    # it. Cached like the other read-mostly API responses so a burst of
    # link-preview crawlers for the same URL doesn't re-render the image
    # (fetch the external photo, base64-encode it, run satori) per hit.
    #
    # Exact match, not a prefix: route.tsx has no catch-all/sub-path
    # segment, so /api/og is the only real path — a prefix match would
    # also (harmlessly today, but needlessly) route something like
    # /api/oganize-whatever to the frontend.

    location = /api/og {
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache civitas_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # -- Public developer API (rate-limited, not cached here) --
    #
    # Its responses carry the caller's own X-RateLimit-Remaining/-Reset;
    # a cached copy would hand one client's counts to every other.

    location /api/public/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # -- Every other API endpoint (rate-limited, cached as the backend says) --
    #
    # No proxy_cache_valid on purpose: nginx then stores exactly the
    # responses the backend marks cacheable (a 200 from a public read,
    # api/cache_headers.py) for exactly as long as it says, and nothing
    # else — admin, health, visit tracking and every error carry no
    # Cache-Control and pass straight through. POSTs are never cached.
    # A new public endpoint is cached here the moment it opts in with a
    # header; it needs no block of its own.
    #
    # Expired entries are refreshed behind the reader
    # (background_update) with a conditional request the backend answers
    # with a bodiless 304 when the data hasn't changed (revalidate), and
    # served stale while the backend is down or restarting.

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 16k;
        proxy_cache civitas_cache;
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # -- Next.js static assets (immutable hashed filenames) --

    location /_next/static/ {
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache civitas_cache;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # -- Frontend (HTML pages, SSR) --

    location / {
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
