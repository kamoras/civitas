# Swarm-only overlay — apply alongside the base file:
#   docker stack deploy -c docker-compose.yml -c docker-compose.swarm.yml civitas
#
# What this changes and why:
#
# - `networks.default.driver: overlay` — gives every service a stable
#   DNS name (backend/frontend/llama-server/nginx) that keeps resolving to
#   whichever task is currently healthy across a rolling update. This is
#   what replaces deploy.sh's blue/green slot bookkeeping + dynamically
#   rewritten nginx upstreams: Swarm's `update_config.order: start-first`
#   below already IS zero-downtime blue/green, just built into the
#   engine instead of hand-rolled in bash.
#
# - backend/frontend/llama-server `ports: !reset []` — Swarm services
#   can't restrict a published port to 127.0.0.1 the way plain `docker
#   run -p 127.0.0.1:PORT:PORT` can — confirmed live with a throwaway
#   `docker service create --publish mode=host,...` test, reachable from
#   another LAN host, not just localhost; the same limitation applies to
#   the default `ingress` mode (the compose ports long-syntax `host_ip:`
#   field is a plain-Docker-only feature, silently not enforceable by
#   Swarm's PortConfig). Rather than accept that regression (all three are
#   deliberately loopback-only today — nginx is the only intended path to
#   backend/frontend, and nothing outside the stack needs to reach
#   llama-server at all) or bolt on host firewall rules, none of them
#   publish a host port under Swarm — nginx (below) is the only service
#   published to the host, on the same port 8081 as before. This is *more*
#   restrictive than the pre-Swarm setup, not less. (`ports: []` alone
#   does NOT work here — Compose's merge treats an empty list override as
#   "no override," not "clear the base list"; `!reset` is the documented
#   way to force that.)
#
# - `volumes.app_data` `external: true` — the real production sqlite DB
#   lives in a Docker volume already named civitas_app_data (created by
#   the original hand-rolled `docker run`/`docker compose up`, predating
#   this compose file — verified live via `docker inspect`, not assumed).
#   Pinning it explicitly removes any ambiguity about which volume a
#   stack deploy binds to — getting this wrong would mean starting from
#   an empty database. Plain `docker compose up` dev usage doesn't apply
#   this overlay, so it still gets an ordinary auto-created local volume,
#   not this pinned production one.
#
# - `nginx` service — nginx moves into the stack, attached to the same
#   overlay network, so it can reach `backend`/`frontend` by Swarm's
#   own DNS instead of a config file deploy.sh rewrites and reloads on
#   every deploy. Published on 8081 (unchanged — this is the port the
#   host's router port-forwarding targets, per-request from the site
#   owner not to change it) via `mode: host`, which is fine here since
#   8081 is meant to be reachable from the LAN/internet already.

#
# - `backend` is the read-only API (PROCESS_ROLE=api, two uvicorn worker
#   processes) and `pipeline` runs everything that writes in the
#   background: the scheduler, startup jobs and every triggered run
#   (PROCESS_ROLE=worker, one process). Same image. More containers add no
#   hardware; the split is so a pipeline can't hold the Python interpreter
#   lock page requests wait on, can't take the site down with it when it
#   runs out of memory, and gets its own memory limit. nginx sends
#   /api/admin/ and the trigger endpoints to `pipeline` (nginx/civitas.conf,
#   "Background work"); the API process refuses any it is sent (503).
#   Plain `docker compose up` keeps a single PROCESS_ROLE=all backend.

networks:
  default:
    driver: overlay

volumes:
  app_data:
    external: true
    name: civitas_app_data

services:
  llama-server:
    ports: !reset []
    volumes:
      # The real production model lives at this fixed host path (verified
      # live via `ls /mnt/nvme/llama-server/models`) -- set in the Pi's
      # .env, not committed, same LLAMA_MODELS_DIR var docker-compose.yml
      # already reads.
      - ${LLAMA_MODELS_DIR}:/models:ro
    deploy:
      # stop-first, not start-first like backend/frontend below: running
      # two model instances at once during a rolling update is needless
      # memory pressure on the Pi for a service that isn't on any live
      # user-facing request path (nightly batch pipeline only) -- the app
      # already treats a temporarily-unreachable LLM as a per-request
      # timeout, not a hard failure (see AGENTS.md), so a few seconds of
      # restart gap here costs nothing in practice.
      update_config:
        order: stop-first
        failure_action: rollback
        delay: 5s
        monitor: 15s
      restart_policy:
        condition: any
        delay: 5s

  backend:
    ports: !reset []
    environment:
      - PROCESS_ROLE=api
      # Read-only work scales across processes: each worker has its own
      # interpreter lock. Each also holds its own copy of the search
      # embedding model, preloaded so no request loads one
      # (main._preload_models). Measured 2026-09: ~0.9 GB a worker (the app
      # ~800 MB, the search model ~28 MB; /api/qa's ~10 MB model has since
      # gone with that route), 1.8 GB for two plus the supervisor, under the
      # 4G limit docker-compose.yml gives backend.
      # Raise only after checking memory under load (`docker stats`).
      - WEB_CONCURRENCY=2
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
        delay: 5s
        monitor: 20s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s

  pipeline:
    image: civitas-backend:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:////data/civitas.db
      - LLM_BACKEND=llama-server
      - LLAMA_SERVER_URL=http://llama-server:8070
      - PROCESS_ROLE=worker
      # One process, always: the admin status endpoint reports run flags
      # held in this process's memory (the app refuses to start otherwise).
      - WEB_CONCURRENCY=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # /api/live, as backend's (docker-compose.yml): /api/health waits on
      # llama-server, and this is the container that keeps it busy (the
      # pipeline's LLM work, Explore summaries) — a slow answer there
      # would have Swarm replace the task mid-run.
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          # What the single backend container had when it ran both halves.
          # With backend's 4G, llama-server's 2G and frontend's 512M the
          # limits total ~10.5G of the Pi's 15.8G, so each container meets
          # its own limit before the host runs out.
          memory: 4G
      # stop-first, unlike backend: two pipeline processes overlapping
      # would load a second set of models for nothing and run two
      # schedulers (safe — every job takes a lease — but pointless).
      # check-and-deploy.sh doesn't deploy while a run is in progress.
      # Startup recovery relies on this order too: a new pipeline process
      # treats a run row or DISTRICT_LINES lease the old one left as dead
      # (run_tracker.sweep_orphaned_runs, district_pvi.release_orphaned_holds
      # — the latter also waits for ten minutes without a beat, a second
      # guard only, ORPHAN_RECHECK_S). Don't switch this to
      # start-first without revisiting both. The
      # gap still costs the admin endpoints and new Explore summaries until
      # the new task is healthy (nginx answers those as a wait the page
      # retries; summaries already made are served by backend), and it
      # cancels any summary being generated — its reader's page asks again.
      update_config:
        order: stop-first
        failure_action: rollback
        delay: 5s
        monitor: 20s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s

  frontend:
    ports: !reset []
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
        delay: 5s
        monitor: 20s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: civitas-nginx:${IMAGE_TAG:-latest}
    ports:
      - target: 8081
        published: 8081
        protocol: tcp
        mode: host
    # backend/frontend get theirs from docker-compose.yml's base
    # definition — nginx is only ever defined here, so it needs its own.
    # See docker-compose.yml for why every service has a logging block.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No depends_on — see the same note on frontend in docker-compose.yml;
    # nginx not strictly waiting for backend/frontend to exist first is
    # fine, its own healthcheck/update_config below still gates traffic.
    deploy:
      # order: stop-first, not start-first like backend/frontend above —
      # `mode: host` port publishing binds the literal host port, and on
      # a single-node swarm there's nowhere else to schedule a second
      # task while the first still holds it. Live-verified: with
      # start-first here, the new task sat in "Pending" forever
      # ("no suitable node (host-mode port already in use on 1 node)"),
      # since nothing was ever going to free the port for it. nginx
      # updates get a few seconds of real gap as a result — the honest
      # trade-off for being the one service that must bind the host port
      # directly. backend/frontend publish no host port at all, so they
      # keep true zero-downtime start-first updates (live-verified: 60/60
      # polls at 1s intervals stayed 200 through a real backend rollout).
      update_config:
        order: stop-first
        failure_action: rollback
        delay: 5s
        monitor: 15s
      restart_policy:
        condition: any
        delay: 5s
