name: Dependabot auto-merge

# Dependabot's patch and minor updates merge on their own once every check
# main requires has passed on the PR (AGENTS.md "Standing rules"). Majors
# wait for the owner or an assistant.
#
# How it stays safe:
# - This job only *enables* GitHub's auto-merge. GitHub performs the merge,
#   and only after the branch's required status checks pass. With no
#   required checks GitHub would merge at once, so the job refuses to
#   enable anything until main requires at least one.
# - It uses the workflow's own GITHUB_TOKEN; there is no secret to keep.
#   A merge made with that token starts no workflow, so main gets no push
#   run of CI for it; check-and-deploy.sh starts one (workflow_dispatch)
#   for a commit on main that has none, and production deploys a merged
#   update only after that run on the merge commit succeeds.
# - Dependabot's alert lookup needs a personal token, so this does not
#   know whether a major fixes a security alert: every major waits.

on: pull_request

permissions: {}

jobs:
  enable:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'kamoras/civitas'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              echo "merge=true" >> "$GITHUB_OUTPUT"; echo "$UPDATE_TYPE: auto-merge" ;;
            *)
              echo "merge=false" >> "$GITHUB_OUTPUT"; echo "$UPDATE_TYPE: left for the owner" ;;
          esac

      - name: Enable auto-merge
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          # Required checks from a ruleset, or from classic branch protection.
          ruleset=$(gh api "repos/$REPO/rules/branches/main" \
            --jq '[.[] | select(.type == "required_status_checks")] | length')
          classic=$(gh api "repos/$REPO/branches/main" \
            --jq '.protection.required_status_checks.contexts // [] | length')
          if [ "${ruleset:-0}" -eq 0 ] && [ "${classic:-0}" -eq 0 ]; then
            echo "::error::main requires no status checks, so auto-merge would merge before CI. Add a ruleset requiring the CI checks first."
            exit 1
          fi
          gh pr merge --auto --squash "$PR_URL"
