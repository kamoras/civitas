name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default GITHUB_TOKEN permissions are broader than any job here needs (none
# push packages, comment on PRs, or write releases) — scope down to
# read-only.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — Lint, Test & Build
    runs-on: ubuntu-latest
    # No job here sets an explicit timeout, so a hung step (a stalled
    # network fetch, not a real hang in our own code) rides GitHub's
    # 360-minute default before anything notices — confirmed live
    # 2026-07-25: backend-slow's `pip install` stalled for 46 minutes
    # before the runner disconnected on its own, not because any timeout
    # caught it. Normal run: under 1 minute; 3x+ headroom.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        # No coverage gate yet — this is the first test infra the frontend
        # has ever had (vitest + Testing Library, 2026-07-23); ratchet up
        # a coverage floor once there's an actual baseline to ratchet from,
        # same reasoning as the backend's diff-coverage gate comment.
        run: npm test
      - name: Build
        run: npm run build

  backend-fast:
    name: Backend — Fast Tests
    runs-on: ubuntu-latest
    # See frontend job's comment on why every job here has one of these.
    # Normal run: 4-5 minutes.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the diff-coverage gate below compares against
          # origin/main, which a depth-1 checkout doesn't have.
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc g++ libxml2-dev libxslt-dev

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Lint (ruff)
        # Pinned: ruff 0.16.0 (released 2026-07-23) flags 345 pre-existing
        # violations repo-wide, breaking every PR the moment it hit PyPI.
        # Upgrade deliberately (bump the pin + fix the new findings in one
        # PR), not implicitly via whatever version `pip install ruff` grabs.
        run: |
          pip install "ruff==0.15.4"
          # scripts/ too, not just app/. It was excluded, and a plain
          # NameError sat in scripts/rescore.py's return statement — past
          # every line of work the script does, so it only ever surfaced
          # after a full run. One-off calibration scripts are exactly the
          # code nobody re-runs often enough to find that by hand.
          ruff check app/ scripts/

      # Two-part coverage gate:
      #   1. TOTAL floor (--cov-fail-under=46): a regression backstop only
      #      — measured 47.6% when introduced (2026-07-22). It stops
      #      test deletion; it is not the mechanism that raises coverage.
      #   2. CHANGED-LINES gate (diff-cover, next step): the driver. Every
      #      PR's new/modified lines must be 60%+ covered — above the
      #      ~48% total, so each merge mathematically pulls the total UP.
      #      60 was calibrated against this repo's own recent well-tested
      #      work (the last 8 commits measured 62% patch coverage —
      #      pipeline orchestration loops resist unit testing), per the
      #      repo's fit-thresholds-against-real-data convention, not an
      #      aspirational number that routine fixes can't meet. Ratchet
      #      it up (60 -> 70 -> 80) as testing culture matures; when the
      #      total rises meaningfully, drag the floor up behind it.
      - name: Run fast tests with total-coverage floor (no embedding model)
        run: >
          python -m pytest tests/ -v -m "not slow"
          --cov=app --cov-report=term --cov-report=html --cov-report=xml
          --cov-fail-under=46

      - name: Changed-lines coverage gate (diff-cover)
        run: >
          diff-cover coverage.xml --compare-branch=origin/main
          --fail-under=60 --markdown-report diff_coverage.md

      # Both reports on the Actions run summary page — the canonical
      # "where does coverage stand" view, no external service.
      - name: Publish coverage reports to job summary
        if: always()
        run: |
          echo "## Changed-lines coverage (gate: 60%)" >> "$GITHUB_STEP_SUMMARY"
          cat diff_coverage.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "_no diff coverage report generated_" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Total backend coverage (floor: 46%)" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown --skip-empty >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-html
          path: backend/htmlcov/
          retention-days: 14

  backend-image:
    name: Backend — Docker Image Builds
    runs-on: ubuntu-latest
    # See frontend job's comment on why every job here has one of these.
    # Normal run: 5-6 minutes (a fresh, from-scratch pip install inside the
    # image build — the full ML stack plus Chromium's own download, since
    # 2026-07-25 — makes this one the least predictable of the four).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # Catches image-level breakage (e.g. requirements conflicts that
      # only surface in the container build — an inconsistent Dependabot
      # pin made main undeployable for a day in 2026-07).
      # Retried because the failure this job actually produces most often
      # is not a broken image — it is Docker Hub refusing the anonymous
      # token fetch for the base image:
      #
      #   ERROR: failed to authorize: failed to fetch oauth token:
      #   Post "https://auth.docker.io/token": read: connection reset by peer
      #
      # That lands in the first ~10 seconds, marks the PR red, and needs a
      # human to notice and re-run a job that was never testing anything at
      # the time it failed. Three attempts with a backoff cost nothing on
      # the happy path (the loop exits on the first success) and cannot
      # mask a genuine build break, which fails identically all three
      # times. Registry rate limits are per-IP on shared runners, so the
      # gap between attempts is deliberately long enough to outlast a
      # short throttle rather than spend all three tries inside it.
      - name: Build backend image (amd64 smoke build)
        run: |
          for attempt in 1 2 3; do
            if docker build backend/; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Backend image build attempt $attempt failed; retrying in $((attempt * 30))s"
              sleep $((attempt * 30))
            fi
          done
          echo "::error::Backend image build failed three times"
          exit 1

  backend-slow:
    name: Backend — Embedding Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # See frontend job's comment on why every job here has one of these —
    # this specific job is the one that actually hung 2026-07-25 (pip
    # install stalled 45+ minutes on a cold cache after requirements.txt
    # changed). Normal run: 2-3 minutes with a warm pip/model cache; wider
    # margin than the other jobs since a genuine cache miss here means
    # downloading the full multi-GB ML stack from scratch, not just a hang.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc g++ libxml2-dev libxslt-dev

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Cache sentence-transformer model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: st-model-all-MiniLM-L6-v2

      - name: Run slow tests (loads embedding model)
        run: python -m pytest tests/ -v -m slow
