version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    # requirements.txt pins the *whole resolved tree*, not just direct
    # dependencies. That means Dependabot sees ~90 pinned lines and treats
    # each as independently upgradable — but many of them are not. Some are
    # held to an exact version by the package that pulls them in, so bumping
    # one line on its own produces a requirements file that pip cannot
    # resolve at all.
    #
    # This has now happened twice, both caught by CI at `pip install` with
    # ResolutionImpossible (Backend — Fast Tests *and* Backend — Docker
    # Image Builds, so an inconsistent tree cannot reach main):
    #
    #   PR #324  pydantic-core 2.46.4 -> 2.47.0, while pydantic 2.13.4
    #            requires `pydantic-core==2.46.4` exactly.
    #   PR #338  tokenizers 0.22.2 -> 0.23.1, while transformers requires
    #            `tokenizers<=0.23.0` — and *every* published transformers,
    #            up to 5.14.1, has that same cap.
    #
    # Auditing the installed tree for this shape (an exact `==` imposed by
    # another pinned package) turns up the same trap on pdfminer.six, which
    # pdfplumber pins exactly. The two settings below handle the two
    # distinct cases.
    #
    # (There was also an `opentelemetry` group here for the OTel family,
    # whose members pin each other exactly. Removed 2026-09-28 along with
    # the packages themselves: nothing in the app, scripts, CI or deploy
    # configured OpenTelemetry, and no pinned package required it. The
    # family, grpcio, protobuf and the rest of the 42 pins removed with it
    # match ChromaDB's dependency tree (OTel, the kubernetes client,
    # onnxruntime's flatbuffers), i.e. most likely left behind by the
    # sqlite-vec migration, and were still installed into every backend
    # image. If OTel is ever wired up
    # for real, restore the group with it: grouping is what lets a family
    # with mutual `==` pins bump as one resolvable unit.)
    groups:
      # pdfplumber pins `pdfminer.six==<version>` exactly. Until 2026-09-29
      # pdfminer.six itself was unpinned (so no group was needed); it is
      # pinned now that requirements.txt really does pin the whole tree, so
      # the two must bump as one unit or the PR can't resolve. (torch's
      # CUDA siblings, flagged by the same audit, are gone entirely: torch
      # is the CPU-only build now — see its ignore entry below.)
      pdfplumber:
        patterns:
          - "pdfplumber"
          - "pdfminer.six"
          - "pdfminer-six"
      #
      # This family is grouped because its members move together in
      # practice (transformers, huggingface_hub, safetensors, hf-xet and
      # sentence-transformers all constrain one another). tokenizers joined
      # the list on 2026-08-30 after first being ignored — see its entry
      # below and the ignore section for that history.
      huggingface:
        patterns:
          - "transformers"
          - "safetensors"
          # requirements.txt writes `huggingface_hub`; both spellings are
          # listed because PEP 503 treats them as one name, same as the
          # pydantic_core/pydantic-core pair below.
          - "huggingface_hub"
          - "huggingface-hub"
          - "sentence-transformers"
          # hf-xet was missing from this list on the first attempt, and the
          # very first grouped PR (#340) failed to install because of it:
          # huggingface_hub 1.26.0 requires `hf-xet>=1.5.1` on every 64-bit
          # platform, while hf-xet sat pinned at 1.4.3 outside the group.
          # A group is only as good as its membership — a family member left
          # out is exactly the lone-unresolvable-line problem this config
          # exists to prevent, just one level down.
          - "hf-xet"
          # Added 2026-08-30: transformers 5.16.1 raised its tokenizers
          # floor to `>=0.23.1,<0.24.0` (was `<=0.23.0`) -- exactly the
          # trigger condition the old tokenizers `ignore` entry named for
          # bringing it back. Moved here instead of just un-ignoring it, so
          # it moves *with* transformers instead of independently (a lone
          # tokenizers bump would still be unresolvable against whatever
          # transformers is pinned to at the time).
          - "tokenizers"
    ignore:
      # torch is pinned in requirements.txt as the CPU-only build, by wheel
      # URL + sha256 for each Linux architecture, plus a plain `==` line for
      # non-Linux dev machines. Dependabot skips URL requirements but would
      # bump that plain line alone, leaving the two URL lines — the ones the
      # Pi and CI actually install — on the old version, with CI still
      # green. Bumped by hand instead; the steps are in requirements.txt.
      - dependency-name: "torch"
      # Children capped by a parent's range, where a release past the cap
      # is already out (checked against PyPI 2026-09-29), so Dependabot
      # would open a PR pip can't install, every week. Lift each entry when
      # its parent's newest release raises the cap (`pip show` / the
      # parent's METADATA Requires-Dist):
      #   pyee    — playwright 1.63.0 requires `pyee<14,>=13`; 14.0.0 is out.
      #   mpmath  — sympy requires `mpmath<1.4`; 1.4.1 is out.
      # Other capped children (atproto's cryptography<51, zstandard<0.26,
      # dnspython<3, ...) have no release past the cap yet; a Dependabot PR
      # for one fails at `pip install` in CI, which is the signal to add it
      # here.
      - dependency-name: "pyee"
        versions: [">=14"]
      - dependency-name: "mpmath"
        versions: [">=1.4"]
      # pydantic-core is one case where grouping cannot help: pydantic
      # pins it with `==`, so there is exactly one correct pydantic-core for
      # a given pydantic and no independent upgrade ever exists. It moves
      # when pydantic moves, as part of that bump.
      #
      # Both spellings are listed: requirements.txt writes `pydantic_core`,
      # and PEP 503 treats the two as the same name.
      - dependency-name: "pydantic-core"
      - dependency-name: "pydantic_core"
      # tokenizers WAS the same case (2026-07): transformers capped it by
      # *range* (`tokenizers<=0.23.0`), and grouping it with transformers
      # on the theory that Dependabot would resolve the pair jointly to
      # something inside the cap didn't work — the first grouped PR (#340)
      # proposed transformers 5.14.1 *and* tokenizers 0.23.1 together,
      # unresolvable because every published transformers up to 5.14.1
      # still capped at <=0.23.0, and tokenizers 0.23.0 itself was never
      # released (PyPI has 0.23.0rc0 then 0.23.1, nothing between) — so
      # `<=0.23.0` admitted no upgrade above the pinned 0.22.2 at all.
      #
      # 2026-08-30: transformers 5.16.1 raised the floor to `>=0.23.1`,
      # exactly the trigger this note said to watch for. tokenizers moved
      # into the huggingface group above instead of staying ignored —
      # verified locally (full `pip install --dry-run` of the resolved
      # tree, then a real install + fast-test run) that transformers
      # 5.16.1 + tokenizers 0.23.1 + the rest of the pinned tree resolves
      # and behaves correctly together.
      #
      # huggingface_hub 2.x (2026-09-28): the first grouped PR to offer it
      # (#682, huggingface_hub 1.32.0 -> 2.0.0 + sentence-transformers
      # 6.1.0) failed every backend job at `pip install` with
      # ResolutionImpossible — sentence-transformers 6.1.0 requires
      # `huggingface-hub>=1.3.0,<2.0.0`, and transformers 5.17.0 and
      # tokenizers 0.23.2 carry the same `<2.0` cap. Grouping can't fix
      # this: no published release of any of them accepts 2.x yet, so
      # every weekly group PR would re-propose the same unresolvable
      # major. Minor/patch bumps within 1.x still flow through the group.
      # Remove this entry only once EVERY pinned package that depends on
      # huggingface-hub (today: sentence-transformers, transformers,
      # tokenizers) accepts 2.x -- check with a full
      # `pip install --dry-run -r requirements.txt` against the new
      # version rather than trusting this list to still be complete.
      - dependency-name: "huggingface_hub"
        update-types: ["version-update:semver-major"]
      - dependency-name: "huggingface-hub"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    ignore:
      # TypeScript (2026-09-28): typescript-eslint — pulled in by
      # eslint-config-next — declares `typescript >=4.8.4 <6.1.0` on every
      # release up to the newest published one (8.71.0), so anything past
      # 6.0.x, the 7.x native-compiler major or a 6.1 minor alike, would lint
      # against an unsupported compiler. package.json holds `~6.0.3` for the
      # same reason, so a fresh install can't drift there either. Lift both
      # (this entry and the tilde) once typescript-eslint's peer range admits
      # the new version — `npm view typescript-eslint peerDependencies` —
      # and bump typescript-eslint alongside it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # llama-server (docker-compose.yml) is pinned by digest, not a tag --
  # ggml-org only publishes a floating `server` tag for this image, no
  # per-build immutable tag (checked live 2026-08-29: neither
  # `server-b10680` nor `b10680` exist even though that's the exact
  # revision the floating tag pointed to that day). Dependabot's docker
  # ecosystem still handles this: it watches the digest a pinned tag
  # resolves to and opens a PR when it moves, same mechanism as any other
  # digest-pinned image. A bad bump degrades gracefully -- the app already
  # treats an unreachable/broken llama-server as a per-request timeout,
  # not a hard failure (see AGENTS.md).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
