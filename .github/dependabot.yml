version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    # requirements.txt pins the *whole resolved tree*, not just direct
    # dependencies. That means Dependabot sees ~130 pinned lines and treats
    # each as independently upgradable — but many of them are not. Some are
    # held to an exact version by the package that pulls them in, so bumping
    # one line on its own produces a requirements file that pip cannot
    # resolve at all.
    #
    # This has now happened twice, both caught by CI at `pip install` with
    # ResolutionImpossible (Backend — Fast Tests *and* Backend — Docker
    # Image Builds, so an inconsistent tree cannot reach main):
    #
    #   PR #324  pydantic-core 2.46.4 -> 2.47.0, while pydantic 2.13.4
    #            requires `pydantic-core==2.46.4` exactly.
    #   PR #338  tokenizers 0.22.2 -> 0.23.1, while transformers requires
    #            `tokenizers<=0.23.0` — and *every* published transformers,
    #            up to 5.14.1, has that same cap.
    #
    # Auditing the installed tree for this shape (an exact `==` imposed by
    # another pinned package) turns up the same trap waiting on the whole
    # OpenTelemetry family, on pdfminer.six, and on torch's CUDA siblings.
    # The two settings below handle the two distinct cases.
    groups:
      # Families whose members pin each other exactly. Grouping makes
      # Dependabot bump the family as one unit, so the PR resolves; these
      # never move independently in reality, only together.
      #
      #   opentelemetry-api  <- ==  opentelemetry-sdk, -semantic-conventions
      #   opentelemetry-proto <- == -exporter-otlp-proto-{grpc,common}
      #   opentelemetry-instrumentation <- == -instrumentation-{asgi,fastapi}
      #   opentelemetry-util-http <- == -instrumentation-{asgi,fastapi}
      #   (plus -semantic-conventions from four separate siblings)
      opentelemetry:
        patterns:
          - "opentelemetry*"
      # Deliberately NOT grouped, though the audit flagged them: torch pins
      # cuda-toolkit/nvidia-*/triton exactly, and pdfplumber pins
      # pdfminer.six exactly — but none of those children are themselves
      # pinned in requirements.txt, so Dependabot never proposes them and a
      # group for either family would be config that does nothing. Only the
      # parents (torch, pdfplumber) are pinned, and bumping a parent alone
      # resolves fine because pip is free to move the unpinned children.
      # Add the group if a future `pip freeze` ever pins them.
      #
      # This family is grouped because its members move together in
      # practice (transformers, huggingface_hub, safetensors, hf-xet and
      # sentence-transformers all constrain one another). Note that
      # tokenizers is deliberately NOT in this list — see the ignore
      # section for why grouping turned out not to be the answer there.
      huggingface:
        patterns:
          - "transformers"
          - "safetensors"
          # requirements.txt writes `huggingface_hub`; both spellings are
          # listed because PEP 503 treats them as one name, same as the
          # pydantic_core/pydantic-core pair below.
          - "huggingface_hub"
          - "huggingface-hub"
          - "sentence-transformers"
          # hf-xet was missing from this list on the first attempt, and the
          # very first grouped PR (#340) failed to install because of it:
          # huggingface_hub 1.26.0 requires `hf-xet>=1.5.1` on every 64-bit
          # platform, while hf-xet sat pinned at 1.4.3 outside the group.
          # A group is only as good as its membership — a family member left
          # out is exactly the lone-unresolvable-line problem this config
          # exists to prevent, just one level down.
          - "hf-xet"
    ignore:
      # pydantic-core is one case where grouping cannot help: pydantic
      # pins it with `==`, so there is exactly one correct pydantic-core for
      # a given pydantic and no independent upgrade ever exists. It moves
      # when pydantic moves, as part of that bump.
      #
      # Both spellings are listed: requirements.txt writes `pydantic_core`,
      # and PEP 503 treats the two as the same name.
      - dependency-name: "pydantic-core"
      - dependency-name: "pydantic_core"
      # tokenizers turned out to be the same case, though it did not look
      # like it. transformers caps it by *range* (`tokenizers<=0.23.0`), and
      # the first version of this config grouped it with transformers on the
      # theory that Dependabot would then resolve the pair jointly to
      # something inside the cap. It does not: the very first grouped PR
      # (#340) proposed transformers 5.14.1 *and* tokenizers 0.23.1
      # together, which is unresolvable, because every published
      # transformers — 5.14.1 included — still caps at <=0.23.0.
      #
      # The detail that settles it: tokenizers 0.23.0 was never released.
      # PyPI has 0.23.0rc0 and then 0.23.1, nothing between. So `<=0.23.0`
      # admits no published version above the pinned 0.22.2, and there is
      # no tokenizers upgrade to take at all until transformers raises its
      # cap — at which point transformers' own grouped bump carries it.
      #
      # Re-check this if transformers ever ships a wider cap; the ignore can
      # come back out then.
      - dependency-name: "tokenizers"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # llama-server (docker-compose.yml) is pinned by digest, not a tag --
  # ggml-org only publishes a floating `server` tag for this image, no
  # per-build immutable tag (checked live 2026-08-29: neither
  # `server-b10680` nor `b10680` exist even though that's the exact
  # revision the floating tag pointed to that day). Dependabot's docker
  # ecosystem still handles this: it watches the digest a pinned tag
  # resolves to and opens a PR when it moves, same mechanism as any other
  # digest-pinned image. A bad bump degrades gracefully -- the app already
  # treats an unreachable/broken llama-server as a per-request timeout,
  # not a hard failure (see AGENTS.md).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
