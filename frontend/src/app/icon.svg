<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The wordmark's C (Archivo 800, the glyph's own outline) over a ledger
       rule. Light scheme: parchment on ink, so the mark holds its ground on
       a light tab strip; dark scheme: ink on parchment. Each rule is its
       theme's ledger green. Rendered to apple-icon.png and the manifest's
       PNGs (see icons.test.ts); librsvg ignores the media query, so those
       take the light-scheme colours. -->
  <style>
    .g { fill: #1e1a15 } .c { fill: #f5efe2 } .r { fill: #7fd49a }
    @media (prefers-color-scheme: dark) {
      .g { fill: #f5efe2 } .c { fill: #1e1a15 } .r { fill: #1b5e34 }
    }
  </style>
